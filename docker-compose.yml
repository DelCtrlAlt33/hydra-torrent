services:
  hydra:
    image: ghcr.io/delctrlalt33/hydra-torrent:latest
    # Building from source instead? Clone the repo, comment out `image:` above
    # and uncomment this:
    # build: .
    container_name: hydra-torrent
    restart: unless-stopped
    ports:
      - 8765:8765            # web UI
      # BitTorrent port. Without these two, other peers cannot connect in to
      # you (downloads still work, but slower and with fewer peers).
      - 6001:6001
      - 6001:6001/udp
    volumes:
      - ./data:/data         # config, certs, downloads (created automatically)
      # Optional: auto-file finished downloads into your Plex/Jellyfin library.
      # Uncomment, point at your real folders, then set /movies and /tv in
      # Hydra's Settings. See docs/plex-jellyfin.md before changing these.
      # - /path/to/movies:/movies
      # - /path/to/tv:/tv
    environment:
      - TZ=UTC
      # Optional: ask for a password before the web UI opens. You can also
      # set one later in Settings -> Web UI password instead.
      # - HYDRA_PASSWORD=change-me

# Want your torrent traffic to go through a VPN? See docs/recommended-setup.md
# for a complete working example with gluetun.
