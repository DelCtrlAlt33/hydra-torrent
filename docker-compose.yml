services:
  hydra:
    build: .
    container_name: hydra-torrent
    restart: unless-stopped
    ports:
      - 8765:8765
    volumes:
      - ./data:/data         # config, certs, downloads (created automatically)
      # Optional: auto-file finished downloads into your Plex/Jellyfin library.
      # Uncomment, point at your real folders, then set /movies and /tv in
      # Hydra's Settings. See docs/plex-jellyfin.md before changing these.
      # - /path/to/movies:/movies
      # - /path/to/tv:/tv
    environment:
      - TZ=UTC

# Want your torrent traffic to go through a VPN? See docs/recommended-setup.md
# for a complete working example with gluetun.
