name: Docker image

# Publishes ghcr.io/delctrlalt33/hydra-torrent so people can `docker pull`
# instead of cloning and building. Runs on every version tag (vX.Y.Z), which
# is already part of shipping a release, plus a manual button for re-runs.
#
# First publish only: GitHub creates the package as PRIVATE. Open
# github.com/DelCtrlAlt33?tab=packages -> hydra-torrent -> Package settings ->
# Change visibility -> Public, once. Later pushes keep that setting.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/delctrlalt33/hydra-torrent

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # v1.4.34 -> 1.4.34, 1.4, latest. A manual run (no tag) gets an
          # edge tag only, so it can never overwrite `latest` by accident.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=edge,enable=${{ !startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=Hydra Torrent
            org.opencontainers.image.description=BitTorrent client built for your media server: Jackett search, RSS auto-download, Plex/Jellyfin auto-filing, VPN kill switch.
            org.opencontainers.image.licenses=MIT

      # Smoke test before anything is published: build for this runner's
      # own architecture, start it, and require the web UI to answer. A
      # broken image (missing module, bad dependency) fails here instead of
      # landing on `latest` for everyone who pulls.
      - name: Build for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: hydra-smoke:test

      - name: Smoke test
        run: |
          docker run -d --name smoke -p 8765:8765 hydra-smoke:test
          for i in $(seq 1 60); do
            code=$(curl -sk -o /dev/null -w '%{http_code}' https://127.0.0.1:8765/ui || true)
            if [ "$code" = "200" ]; then echo "web UI up after ${i}s"; break; fi
            sleep 1
          done
          docker logs smoke | tail -40
          test "$code" = "200"
          # The optional password must gate the UI when HYDRA_PASSWORD is set.
          docker rm -f smoke
          docker run -d --name smoke -p 8765:8765 -e HYDRA_PASSWORD=smoke-test-pw hydra-smoke:test
          for i in $(seq 1 60); do
            code=$(curl -sk -o /dev/null -w '%{http_code}' https://127.0.0.1:8765/ui || true)
            if [ "$code" = "401" ]; then echo "login page served after ${i}s"; break; fi
            sleep 1
          done
          test "$code" = "401"
          docker rm -f smoke

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
