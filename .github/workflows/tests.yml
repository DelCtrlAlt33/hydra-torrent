name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    # 04:17 UTC daily - off-peak, deliberately not on the hour. This is the
    # "self-healing" tripwire: it catches drift that isn't triggered by a
    # code change at all (an upstream site/API changing shape, a dependency
    # release altering behavior) within a day, instead of whenever someone
    # next happens to touch this file. See tests/test_search.py's note on
    # why search_online_public() isn't covered - that's exactly the class
    # of drift this schedule exists to catch early once it is.
    - cron: "17 4 * * *"
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Scoped to what tests/ actually imports (requests, beautifulsoup4,
          # psutil, pydantic) rather than the full requirements.txt. That
          # file also pulls in libtorrent, fastapi, and ttkbootstrap - none
          # of which the current unit-test tier touches, and libtorrent's
          # wheel availability is the kind of thing that can turn CI red
          # for reasons that have nothing to do with a real bug. Once
          # integration tests land (FastAPI TestClient against
          # hydra_daemon.py), this step needs to grow to
          # `pip install -r requirements.txt` and accept that tradeoff
          # deliberately, not by accident.
          pip install -r requirements-test.txt
          pip install requests beautifulsoup4 psutil pydantic

      - name: Run tests
        run: python -m pytest -v --cov=. --cov-report=term-missing

      - name: Report failure on scheduled (drift-detection) run
        if: failure() && github.event_name == 'schedule'
        run: |
          echo "::warning::Nightly drift-detection run failed - something broke without a code change. Check upstream dependencies / external services before assuming the code is at fault."
