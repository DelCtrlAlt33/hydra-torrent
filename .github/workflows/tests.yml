name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    # 04:17 UTC daily - off-peak, deliberately not on the hour. This is the
    # "self-healing" tripwire: it catches drift that isn't triggered by a
    # code change at all (an upstream site/API changing shape, a dependency
    # release altering behavior) within a day, instead of whenever someone
    # next happens to touch this file. See tests/test_search.py's note on
    # why search_online_public() isn't covered - that's exactly the class
    # of drift this schedule exists to catch early once it is.
    - cron: "17 4 * * *"
  workflow_dispatch: {}

# Default GITHUB_TOKEN permissions are broader than this workflow needs -
# it only runs tests and posts to an external webhook, never touches repo
# contents/PRs/issues. Scoping down limits the blast radius if any action
# in the chain (including third-party ones like actions/checkout) were
# ever compromised.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Scoped to what tests/ actually imports (requests, beautifulsoup4,
          # psutil, pydantic) rather than the full requirements.txt. That
          # file also pulls in libtorrent, fastapi, and ttkbootstrap - none
          # of which the current unit-test tier touches, and libtorrent's
          # wheel availability is the kind of thing that can turn CI red
          # for reasons that have nothing to do with a real bug. Once
          # integration tests land (FastAPI TestClient against
          # hydra_daemon.py), this step needs to grow to
          # `pip install -r requirements.txt` and accept that tradeoff
          # deliberately, not by accident.
          pip install -r requirements-test.txt
          pip install requests beautifulsoup4 psutil pydantic defusedxml cryptography

      - name: Run tests
        run: python -m pytest -v --cov=. --cov-report=term-missing

      - name: Report failure on scheduled (drift-detection) run
        if: failure() && github.event_name == 'schedule'
        run: |
          echo "::warning::Nightly drift-detection run failed - something broke without a code change. Check upstream dependencies / external services before assuming the code is at fault."

      - name: Notify Discord on failure
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          SHA_SHORT: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Built with jq (not manual string concatenation) so branch
          # names, commit messages, etc. can't produce malformed JSON or
          # break out of the payload - a github.ref_name with a quote or
          # backtick in it would otherwise silently corrupt the request.
          payload=$(jq -n \
            --arg event "$EVENT_NAME" \
            --arg ref "$REF_NAME" \
            --arg sha "${SHA_SHORT:0:7}" \
            --arg url "$RUN_URL" \
            '{content: "**Hydra Torrent CI failed** - \($event) on `\($ref)` (`\($sha)`)\n\($url)"}')
          curl -sf -H "Content-Type: application/json" -d "$payload" "$DISCORD_WEBHOOK_URL"
