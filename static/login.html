<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Hydra Torrent - Sign in</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0a0a; --card: #0f1a0f; --border: #1a331a; --accent: #00ff41;
      --accent-dim: #008f11; --red: #ff4040; --text: #00ff41; --muted: #008f11;
      --input-bg: #0a0a0a; --btn-text: #000;
    }
    body {
      background: var(--bg); color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 14px;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 16px;
    }
    .card {
      width: 100%; max-width: 340px; background: var(--card);
      border: 1px solid var(--border); border-radius: 8px; padding: 28px 24px;
    }
    h1 { font-size: 18px; font-weight: 600; margin-bottom: 4px; }
    p.sub { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
    label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
    input {
      width: 100%; padding: 9px 10px; background: var(--input-bg); color: var(--text);
      border: 1px solid var(--border); border-radius: 4px; font-size: 14px; outline: none;
    }
    input:focus { border-color: var(--accent-dim); }
    button {
      width: 100%; margin-top: 16px; padding: 9px; border: none; border-radius: 4px;
      background: var(--accent); color: var(--btn-text); font-weight: 600; font-size: 14px;
      cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: default; }
    .err { color: var(--red); font-size: 13px; margin-top: 12px; min-height: 18px; }
  </style>
</head>
<body>
  <form class="card" id="login-form" autocomplete="on">
    <h1>Hydra Torrent</h1>
    <p class="sub">This Hydra is password protected.</p>
    <input type="text" name="username" value="hydra" autocomplete="username" hidden>
    <label for="password">Password</label>
    <input type="password" id="password" name="password" autocomplete="current-password" autofocus required>
    <button type="submit" id="submit">Sign in</button>
    <div class="err" id="err" role="alert"></div>
  </form>
  <script>
    const form = document.getElementById('login-form');
    const btn = document.getElementById('submit');
    const err = document.getElementById('err');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      btn.disabled = true;
      err.textContent = '';
      try {
        const r = await fetch('/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({ password: document.getElementById('password').value }),
        });
        if (r.ok) { window.location.replace('/ui'); return; }
        const d = await r.json().catch(() => ({}));
        err.textContent = d.detail || ('Sign in failed (' + r.status + ')');
      } catch (ex) {
        err.textContent = 'Could not reach Hydra: ' + ex.message;
      }
      btn.disabled = false;
      document.getElementById('password').select();
    });
  </script>
</body>
</html>
